name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use persistent pnpm store
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "store-dir=$HOME/Library/pnpm/store" >> "$GITHUB_WORKSPACE/.npmrc"
          echo "npm_config_store_dir=$HOME/Library/pnpm/store" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - name: Generated files are up to date
        run: pnpm run check:generated
      - name: Typecheck
        run: pnpm run typecheck
      - name: Manifest smoke
        run: pnpm run smoke
